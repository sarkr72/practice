# Push to main  ->  build image (Jib -> ECR)  ->  deploy to ECS Fargate.
#
# The actual deployer is `aws ecs` (register-task-definition + update-service).
# This was chosen over Spinnaker's createServerGroup after running into long-
# standing Spinnaker-on-ECS limitations (EcsSecurityGroupCachingAgent doesn't
# populate, so SecurityGroupSelector NPEs even with explicit IDs). Direct ECS
# is what most teams use in production for Fargate workloads; Spinnaker is
# best at Kubernetes.
#
# The ECS service is owned by Terraform (terraform/ems/service.tf); this
# workflow only rolls a new task-definition revision onto it. Works on the
# first push and every push after — Terraform's service ignores task_definition,
# so this update sticks and is never reverted. Deletes nothing. ECS handles the
# rolling deploy via its own deployment controller — no Spinnaker stages required.
#
# No AWS keys are stored in GitHub: the job mints short-lived credentials by
# assuming the `github-actions-ems` role via OIDC.
#
# Required GitHub config (Settings -> Secrets and variables -> Actions):
#   Variables:
#     AWS_ROLE_ARN   terraform output github_actions_role_arn (terraform/spinnaker)
#     AWS_REGION     us-east-1

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:        # manual trigger from the Actions tab

permissions:
  id-token: write           # required for OIDC role assumption
  contents: read

concurrency:                # one deploy at a time
  group: deploy-main
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  CLUSTER:    ems-dev
  SERVICE:    ems-dev
  CONTAINER:  ems
  ECR_REPO:   ems

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0     # git-commit-id plugin needs history for the image label

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region:     ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Run tests
        run: ./mvnw -B -ntp test

      - name: Build and push image with Jib
        run: >-
          ./mvnw -B -ntp compile jib:build
          -Djib.to.image=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ github.sha }}
          -Djib.to.tags=latest

      # -----------------------------------------------------------------------
      # The service's networking, ALB wiring and desired count are owned by
      # Terraform (terraform/ems/service.tf). This workflow only needs the AWS
      # account id to render the task-definition template.
      # -----------------------------------------------------------------------
      - name: Discover AWS account
        id: lookup
        run: |
          set -euo pipefail
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          echo "account=$ACCOUNT" >> "$GITHUB_OUTPUT"
          echo "AWS account: $ACCOUNT"

      - name: Render task definition
        run: |
          set -euo pipefail
          IMAGE="${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ github.sha }}"
          sed -e "s|__ACCOUNT__|${{ steps.lookup.outputs.account }}|g" \
              -e "s|__IMAGE__|${IMAGE}|g" \
              ecs/taskdef.dev.json.tpl > taskdef.json
          echo "Rendered task definition:"
          cat taskdef.json

      - name: Register new task definition revision
        id: register
        run: |
          set -euo pipefail
          TD_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://taskdef.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "td_arn=$TD_ARN" >> "$GITHUB_OUTPUT"
          echo "Registered: $TD_ARN"

      # The service is created and owned by Terraform; this just rolls the new
      # task-definition revision onto it. Terraform ignores the service's
      # task_definition, so the change sticks and is never reverted.
      - name: Roll out new task definition
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "${CLUSTER}" \
            --service "${SERVICE}" \
            --task-definition "${{ steps.register.outputs.td_arn }}" \
            --force-new-deployment \
            > /dev/null
          echo "Rolled ${SERVICE} onto ${{ steps.register.outputs.td_arn }}"

      - name: Wait for service to stabilize
        run: |
          echo "Waiting for tasks to roll out and pass ALB health checks..."
          aws ecs wait services-stable \
            --cluster "${CLUSTER}" \
            --services "${SERVICE}"
          echo "Deployment stable."

      # -----------------------------------------------------------------------
      # OPTIONAL: trigger Spinnaker's parallel ECS deploy for learning.
      # Only runs when the SPINNAKER_GATE_URL variable is set in the repo.
      # Spinnaker deploys to a separate stack (`ems-spinnaker-vNNN`) on the
      # canary target group, so it can NEVER disturb the live `ems-dev`
      # service deployed above. continue-on-error means a Spinnaker failure
      # won't fail this workflow.
      # -----------------------------------------------------------------------
      - name: Trigger Spinnaker (optional learning path)
        if: ${{ vars.SPINNAKER_GATE_URL != '' }}
        continue-on-error: true
        run: |
          curl -fsS -X POST "${{ vars.SPINNAKER_GATE_URL }}/webhooks/webhook/ems-build-complete" \
            -H "X-Spinnaker-Token: ${{ secrets.SPINNAKER_WEBHOOK_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"parameters\":{\"imageTag\":\"${{ github.sha }}\",\"branch\":\"main\",\"ecrRegistry\":\"${{ steps.ecr.outputs.registry }}\",\"ecrRepo\":\"${{ env.ECR_REPO }}\",\"buildUrl\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}}" \
            || echo "Spinnaker notify failed (non-fatal)."

      - name: Summary
        run: |
          {
            echo "### Deployed"
            echo "Image: \`${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ github.sha }}\`"
            echo "Task definition: \`${{ steps.register.outputs.td_arn }}\`"
            echo "Cluster/Service: \`${{ env.CLUSTER }} / ${{ env.SERVICE }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
