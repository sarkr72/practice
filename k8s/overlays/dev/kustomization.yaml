apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ems-dev

resources:
  - ../../base

# Overwrite the image in Jenkins via `kustomize edit set image` or `kubectl set image`.
# Newer Kustomize versions prefer images: blocks over the images field here.
images:
  - name: placeholder
    newName: 123456789012.dkr.ecr.us-east-1.amazonaws.com/ems
    newTag: latest

patches:
  - target:
      kind: ServiceAccount
      name: ems
    patch: |-
      - op: replace
        path: /metadata/annotations/eks.amazonaws.com~1role-arn
        value: arn:aws:iam::123456789012:role/ems-app-dev

  - target:
      kind: ConfigMap
      name: ems-config
    patch: |-
      - op: replace
        path: /data/SPRING_PROFILES_ACTIVE
        value: dev
      - op: replace
        path: /data/DB_HOST
        value: ems-dev.xxxxxx.us-east-1.rds.amazonaws.com
      - op: replace
        path: /data/REDIS_HOST
        value: ems-dev-redis.xxxxxx.ng.0001.use1.cache.amazonaws.com
      - op: replace
        path: /data/KAFKA_BOOTSTRAP_SERVERS
        value: b-1.ems-dev.xxx.kafka.us-east-1.amazonaws.com:9098,b-2.ems-dev.xxx.kafka.us-east-1.amazonaws.com:9098

  - target:
      kind: ExternalSecret
      name: ems-secrets
    patch: |-
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: ems-dev-db-master
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: ems-dev-db-master
      - op: replace
        path: /spec/data/2/remoteRef/key
        value: ems-dev-redis-auth

  - target:
      kind: Deployment
      name: ems
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
