apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ems
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ems
  minReplicas: 4
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    # Scale up quickly on traffic spikes, scale down slowly to avoid flapping.
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
