apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ems-prod

resources:
  - ../../base
  - hpa.yaml
  - pdb.yaml

images:
  - name: placeholder
    newName: 123456789012.dkr.ecr.us-east-1.amazonaws.com/ems
    newTag: latest   # overwritten by Jenkins with the git-sha tag on each deploy

patches:
  - target:
      kind: ServiceAccount
      name: ems
    patch: |-
      - op: replace
        path: /metadata/annotations/eks.amazonaws.com~1role-arn
        value: arn:aws:iam::123456789012:role/ems-app-prod

  - target:
      kind: ConfigMap
      name: ems-config
    patch: |-
      - op: replace
        path: /data/SPRING_PROFILES_ACTIVE
        value: prod
      - op: replace
        path: /data/DB_HOST
        value: ems-prod.xxxxxx.us-east-1.rds.amazonaws.com
      - op: replace
        path: /data/REDIS_HOST
        value: ems-prod-redis.xxxxxx.ng.0001.use1.cache.amazonaws.com
      - op: replace
        path: /data/KAFKA_BOOTSTRAP_SERVERS
        value: b-1.ems-prod.xxx.kafka.us-east-1.amazonaws.com:9098,b-2.ems-prod.xxx.kafka.us-east-1.amazonaws.com:9098,b-3.ems-prod.xxx.kafka.us-east-1.amazonaws.com:9098

  - target:
      kind: ExternalSecret
      name: ems-secrets
    patch: |-
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: ems-prod-db-master
      - op: replace
        path: /spec/data/1/remoteRef/key
        value: ems-prod-db-master
      - op: replace
        path: /spec/data/2/remoteRef/key
        value: ems-prod-redis-auth

  - target:
      kind: Deployment
      name: ems
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 4
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "500m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "1Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "2"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "2Gi"
