# Guarantees at least 2 pods stay up during voluntary disruptions
# (node drains, cluster upgrades, rolling deploys). Prevents the cluster autoscaler
# or an admin from yanking all replicas at once.

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ems
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: ems
