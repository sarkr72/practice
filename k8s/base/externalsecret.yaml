# Pulled from AWS Secrets Manager by External Secrets Operator.
# The operator must be installed cluster-wide (Helm) and bound to an IRSA role
# with secretsmanager:GetSecretValue permissions.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ems-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager   # cluster-level SecretStore
    kind: ClusterSecretStore
  target:
    name: ems-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_USERNAME
      remoteRef:
        key: ems-dev-db-master   # overlays override per env
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: ems-dev-db-master
        property: password
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: ems-dev-redis-auth
