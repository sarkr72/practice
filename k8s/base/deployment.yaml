apiVersion: apps/v1
kind: Deployment
metadata:
  name: ems
  labels:
    app: ems
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ems
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0      # zero-downtime deploys
  template:
    metadata:
      labels:
        app: ems
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: ems
      terminationGracePeriodSeconds: 60  # give Kafka listeners time to commit offsets
      containers:
        - name: ems
          image: placeholder:latest   # overridden per env by Kustomize image transformer
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef: { name: ems-config }
            - secretRef:    { name: ems-secrets }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { cpu: "1",    memory: "1Gi"   }
          # Probes use Spring Boot Actuator liveness/readiness groups
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 20
            failureThreshold: 3
          lifecycle:
            preStop:
              # Small sleep lets the k8s endpoints controller remove the pod from the service
              # before we start rejecting traffic. Classic graceful shutdown fix.
              exec: { command: ["sh", "-c", "sleep 15"] }
