apiVersion: v1
kind: ServiceAccount
metadata:
  name: ems
  annotations:
    # IRSA — binds this SA to an IAM role created in Terraform.
    # The role grants MSK publish/consume and Secrets Manager read.
    # Overlays override this annotation with the real role ARN per env.
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/ems-app-placeholder
