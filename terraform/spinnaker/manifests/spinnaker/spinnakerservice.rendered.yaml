# SpinnakerService CR ??? the operator reads this and reconciles all Spinnaker
# microservices (deck, gate, clouddriver, orca, front50, echo, rosco, igor).
#
# Placeholders below must be substituted before `kubectl apply`. The README
# in this directory has the one-liner that does it from terraform outputs.
#   148357194949        12-digit account
#   us-east-1            e.g. us-east-1
#   arn:aws:iam::148357194949:role/spinnaker-managed    output: spinnaker_role_arn
#   rinku-spinnaker-persistence-001    output: persistence_bucket
#
# CI is GitHub Actions (.github/workflows/deploy.yml): Actions builds the image
# and POSTs the inbound webhook below, so no Jenkins/igor master is configured.
#
# Auth: disabled. Anyone reaching Deck's LoadBalancer can drive Spinnaker.
# This is a learning setup ??? restrict the LB SG to your IP, or front it with
# Cognito/OIDC before exposing anywhere real.
#
# Persistence: S3 only. front50 stores app/pipeline configs, clouddriver
# stores its cache snapshots.

apiVersion: spinnaker.io/v1alpha2
kind: SpinnakerService
metadata:
  name: spinnaker
  namespace: spinnaker
spec:
  spinnakerConfig:
    config:
      version: 1.34.2
      persistentStorage:
        persistentStoreType: s3
        s3:
          bucket: rinku-spinnaker-persistence-001
          region: us-east-1
          rootFolder: front50
      providers:
        aws:
          enabled: true
          accounts:
            - name: aws-dev
              accountId: "148357194949"
              regions:
                - name: us-east-1
              assumeRole: role/spinnaker-managed
              permissions: {}
          primaryAccount: aws-dev
          defaultAssumeRole: role/spinnaker-managed
        # Two ECS accounts both point at the single underlying AWS account.
        # In a real org these would be separate AWS accounts; same names so
        # the pipeline JSON's credentials: aws-dev / aws-prod just work.
        ecs:
          enabled: true
          # Halyard requires primaryAccount on every enabled provider ??? it'll
          # NullPointerException without it.
          primaryAccount: aws-dev
          accounts:
            - name: aws-dev
              awsAccount: aws-dev
            - name: aws-prod
              awsAccount: aws-dev
      features:
        artifacts: true
      artifacts:
        s3:
          enabled: true
          accounts:
            - name: ecr-artifacts
      # Inbound webhook trigger from GitHub Actions. trust.enabled=false means
      # the X-Spinnaker-Token header is not enforced ??? fine for a learning
      # setup where the Gate LoadBalancer SG is locked to your IP. Set it to
      # true and add a `webhook.preflight` secret to require the token.
      # Halconfig calls this key `webhook` (singular) ??? `webhooks` makes
      # Halyard reject the config with "Unrecognized field".
      webhook:
        trust:
          enabled: false
      security:
        apiSecurity:
          ssl:
            enabled: false
        uiSecurity:
          ssl:
            enabled: false
      deploymentEnvironment:
        accountName: spinnaker
        size: SMALL
        type: Distributed

    # Per-service overrides. Annotates the default SA in the spinnaker
    # namespace with the IRSA role so clouddriver can call ECS / read S3.
    service-settings:
      clouddriver:
        kubernetes:
          serviceAccountName: spinnaker-sa
      front50:
        kubernetes:
          serviceAccountName: spinnaker-sa

  # Expose Deck (UI) and Gate (API) via AWS NLB. No TLS ??? see header note.
  expose:
    type: service
    service:
      type: LoadBalancer
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-type: nlb
      publicPort: 0
      overrides: {}

---
# IRSA-annotated SA for clouddriver/front50. Substitute arn:aws:iam::148357194949:role/spinnaker-managed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spinnaker-sa
  namespace: spinnaker
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::148357194949:role/spinnaker-managed

