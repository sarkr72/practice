# ---------------------------------------------------------------------------
# jules.yml — application metadata and pipeline-as-code.
#
# The Jenkinsfile reads this file at the start of every build. Any change here
# changes the pipeline behavior without touching Groovy. Keep this file owned
# by the app team; let the platform team own the Jenkinsfile shared library.
#
# NOTE: JPMC's actual Jules schema is internal — field names below are modeled
# after the publicly-described pattern (Jenkinsfile + jules.yml + scan plugins
# + Spinnaker handoff). If your org's Jules expects different keys, rename
# them here AND in Jenkinsfile's `readYaml` block. The wiring stays the same.
# ---------------------------------------------------------------------------

schema-version: "1.0"

application:
  name: ems
  app-id: ems-001         # replace with your real corp app ID
  lob: platform-eng                  # line of business / cost center
  team: rinku-team
  contacts:
    - rinkusarkar353@gmail.com
  bitbucket:
    project: PLATFORM
    repo: ems

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
source:
  language: java
  build-tool: maven

build:
  builder-image: maven:3.9-eclipse-temurin-21
  java-version: 21
  maven-args: "-B -ntp"
  artifacts:
    - target/*.jar

# ---------------------------------------------------------------------------
# Test gates — Jenkinsfile only proceeds past each if the gate passes
# ---------------------------------------------------------------------------
test:
  unit:
    enabled: true
    reports: target/surefire-reports/*.xml
    # Enforced by jacoco-maven-plugin's `check` execution in pom.xml — build
    # fails below this. Bump in BOTH places (jacoco.coverage.minimum in pom.xml)
    # to keep them in sync.
    coverage-threshold: 70
  integration:
    enabled: true
    reports: target/failsafe-reports/*.xml
    requires:
      - docker                       # Testcontainers needs the docker socket

# ---------------------------------------------------------------------------
# Security scans — run in parallel after tests pass
# ---------------------------------------------------------------------------
scan:
  sast:
    tool: sonarqube
    project-key: ems
    quality-gate: blocking           # waitForQualityGate abortPipeline=true
  sca:
    tool: dependency-check
    fail-on-cvss: 7                  # HIGH and above
  secret:
    tool: gitleaks
    fail-on-leak: true
  iac:
    tool: tfsec
    paths:
      - terraform/
    fail-on-severity: HIGH
  container:
    tool: trivy
    severity: CRITICAL
    fail-on-severity: CRITICAL
    ignore-unfixed: true

# ---------------------------------------------------------------------------
# Package — Jib builds and pushes the image. No Docker daemon required FOR
# THE BUILD ITSELF (the agent still needs one for Testcontainers + Trivy).
# The jib-maven-plugin block in pom.xml owns the JVM/labels.
# ---------------------------------------------------------------------------
package:
  type: container
  builder: jib
  registry:
    type: ecr
    region: us-east-1
    repository: image-uploader
  tags:
    - "${BUILD_NUMBER}-${GIT_SHA_SHORT}"
    - "${GIT_BRANCH_SAFE}"
    - "latest"

# ---------------------------------------------------------------------------
# Deploy — Jenkins hands off to Spinnaker after the image is pushed.
# Target platform is ECS Fargate (red/black via createServerGroup).
# ---------------------------------------------------------------------------
deploy:
  pipeline: spinnaker
  platform: ecs-fargate
  spinnaker:
    base-url: http://host.docker.internal:8084
    application: helloapp
    pipeline-name: Deploy nginx
    webhook-source: deploy-nginx
  environments:
    - name: dev
      branches: [develop, main]
      auto-promote: true
      smoke-test:
        path: /actuator/health
        expected-status: 200
    - name: prod
      branches: [main]
      auto-promote: false              # manual judgment in Spinnaker
      approvers:
        - release-managers
      smoke-test:
        path: /actuator/health
        expected-status: 200

# ---------------------------------------------------------------------------
# Notifications
# ---------------------------------------------------------------------------
notify:
  slack:
    on-failure: "#ems-alerts"
    on-prod-deploy: "#ems-releases"
