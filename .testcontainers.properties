# Enable container reuse across test runs.
# First run: Testcontainers creates MariaDB/Redis/Kafka containers.
# Subsequent runs: reuse them instead of recreating ? shaves 10-30s per IT run.
#
# IMPORTANT: only takes effect for containers annotated with .withReuse(true).
# Container will be reused based on a hash of its configuration; change any
# env var or image tag and a fresh container is created.
#
# Clean up stale reused containers with:
#   docker ps -a --filter "label=org.testcontainers=true" -q | xargs docker rm -f
testcontainers.reuse.enable=true

# WSL2 + Docker Desktop: if /var/run/docker.sock returns a 400, set DOCKER_HOST
# in your shell instead: export DOCKER_HOST=unix:///var/run/docker-cli.sock
# Do NOT set docker.host here ? it breaks standard Linux / CI environments.