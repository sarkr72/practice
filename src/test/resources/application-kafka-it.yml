# Profile for DepartmentEventFlowIT. Unlike application-it.yml, this one
# leaves Kafka auto-config ENABLED because the test needs it.

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
  batch:
    job:
      enabled: false
  session:
    store-type: none   # don't require Spring Session schema in test DB

ems:
  kafka:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.ems.ems: INFO
    org.apache.kafka: WARN
    org.testcontainers: INFO
