###############################################################################
# LOCAL profile - for 'mvn spring-boot:run -Dspring-boot.run.profiles=local'
# Depends on: docker compose up -d (mysql, redis, kafka)
###############################################################################

spring:
  datasource:
    # Compose maps 3307:3306 so port 3306 stays free if a host MySQL is installed.
    url: jdbc:mysql://localhost:3307/ems?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ems
    password: ems
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1800000

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
    cache:
      type: simple

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s

  # Just the connection point — all consumer/producer tuning lives under ems.kafka
  kafka:
    bootstrap-servers: localhost:9092

  session:
    store-type: redis
    timeout: 30m

ems:
  kafka:
    enabled: true
    consumer:
      group-id: ems-department-consumer-local

management:
  tracing:
    sampling:
      probability: 1.0              # 100% sampling locally for full trace visibility

logging:
  level:
    com.ems.ems: DEBUG
    org.springframework.cache: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
