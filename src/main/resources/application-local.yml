###############################################################################
# LOCAL profile - for 'mvn spring-boot:run -Dspring-boot.run.profiles=local'
# Depends on: docker compose up -d (mysql, redis, kafka)
###############################################################################

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ems?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ems
    password: ems
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1800000

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ems-department-consumer-local

  session:
    store-type: redis
    timeout: 30m

ems:
  kafka:
    enabled: true

logging:
  level:
    com.ems.ems: DEBUG
    org.springframework.cache: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
