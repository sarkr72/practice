###############################################################################
# Common configuration - applied in ALL profiles.
# Profile-specific overrides live in application-{local,dev,prod}.yml
#
# Active profile is selected by:
#   SPRING_PROFILES_ACTIVE env var (set by k8s ConfigMap)
#   -Dspring-boot.run.profiles=local (for local dev via Maven)
###############################################################################

spring:
  application:
    name: ems
  profiles:
    default: local
  data:
    redis:
      host: localhost
      port: 6379

  # Jackson: ISO-8601 dates, never write as numeric timestamps
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC

  # JPA defaults - profiles may override ddl-auto and show-sql
  jpa:
    open-in-view: false            # fail-fast on lazy loading bugs (enterprise default)
    hibernate:
      ddl-auto: validate           # Flyway owns schema; JPA only verifies
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 25
        order_inserts: true
        order_updates: true

  # Flyway manages all schema changes
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Graceful shutdown - k8s preStop sleeps 15s, then SIGTERM arrives here
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  shutdown: graceful
  # Don't leak server details in error responses or Server header
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  tomcat:
    max-threads: 200
    accept-count: 100
    connection-timeout: 20s

# Actuator - k8s probes hit /actuator/health/liveness and /readiness
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never           # never leak DB/Redis hostnames to the world
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis
  metrics:
    tags:
      application: ems
  tracing:
    sampling:
      probability: 0.1              # 10% default; profiles override
  info:
    env:
      enabled: true

###############################################################################
# Custom application config - binds to KafkaProperties (@ConfigurationProperties)
# Common defaults; profiles override env-specific bits (group-id, durability).
###############################################################################
ems:
  kafka:
    enabled: true                  # profiles turn this on
    topics:
      partitions: 3
      replication-factor: 1         # OVERRIDDEN to 3 in dev/prod (MSK is multi-AZ)
      min-insync-replicas: 1        # OVERRIDDEN to 2 in dev/prod
      retention: 7d
      dlt-retention: 30d            # DLT keeps records longer for triage
    producer:
      client-id: ems-department-producer
      compression-type: zstd        # best ratio; switch to lz4 if CPU-bound
      linger-ms: 10                 # small wait to batch records
      batch-size: 32768             # 32 KB
      delivery-timeout: 2m
      request-timeout: 30s
    consumer:
      client-id: ems-department-consumer
      group-id: ems-department-consumer   # OVERRIDDEN per profile
      concurrency: 3                # match topic partition count
      max-poll-records: 100
      max-poll-interval: 5m         # max time between polls before rebalance
      session-timeout: 45s
      heartbeat-interval: 15s       # ~1/3 of session-timeout
      auto-offset-reset: earliest
      isolation-level: read_committed   # only see committed txn messages
    retry:
      max-attempts: 5
      initial-interval: 1s
      multiplier: 2.0               # 1s, 2s, 4s, 8s, 16s
      max-interval: 30s

# Logging - structured JSON in prod via logback-spring.xml
logging:
  level:
    root: INFO
    com.ems.ems: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
